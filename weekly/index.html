<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>每周动手实操 · 索引</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>"><style>
*{box-sizing:border-box}
:root{--bg:#edf0f4;--card:#fff;--ink:#14181d;--muted:#5f6b7a;--line:#e3e7ee;
 --accent:#2563eb;--accentsoft:#e8effe;
 --official:#2563eb;--hot:#ea580c;--papers:#7c3aed;--china:#059669;
 --whybg:#fff7e6;--whyline:#f0a92e;--chip:#eef1f5;
 --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.07);
 --heroa:#2563eb;--herob:#7c3aed}
@media (prefers-color-scheme: dark){:root:not(.light){--bg:#0d1015;--card:#161a21;--ink:#e8ebf0;
 --muted:#98a1ad;--line:#262c37;--accent:#5b9dff;--accentsoft:#12203a;
 --official:#5b9dff;--hot:#fb8c3c;--papers:#a78bfa;--china:#34d399;
 --whybg:#241c0e;--whyline:#b9831f;--chip:#20262f;--shadow:0 1px 2px rgba(0,0,0,.5);
 --heroa:#1e3a8a;--herob:#4c1d95}}
:root.dark{--bg:#0d1015;--card:#161a21;--ink:#e8ebf0;--muted:#98a1ad;--line:#262c37;
 --accent:#5b9dff;--accentsoft:#12203a;--official:#5b9dff;--hot:#fb8c3c;--papers:#a78bfa;--china:#34d399;
 --whybg:#241c0e;--whyline:#b9831f;--chip:#20262f;--shadow:0 1px 2px rgba(0,0,0,.5);
 --heroa:#1e3a8a;--herob:#4c1d95}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.wrap{max-width:800px;margin:0 auto;padding:24px 20px 90px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* 头部 hero */
.hero{background:linear-gradient(135deg,var(--heroa),var(--herob));color:#fff;border-radius:18px;
 padding:26px 26px 22px;margin:6px 0 18px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:29px;line-height:1.25;color:#fff;letter-spacing:-.02em}
.hero .subtitle{color:rgba(255,255,255,.85);font-size:14.5px;margin:8px 0 0;padding:0;border:0}
.hero blockquote{border:0;background:none;padding:0;margin:0}
.hero .lede{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:12px;
 padding:12px 15px;margin-top:16px;font-size:15px;line-height:1.6}
.hero .lede strong{color:#fff}
/* 上/下一篇导航 */
.daynav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px}
.daynav a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
 font-size:14px;box-shadow:var(--shadow)}
.daynav a:hover{border-color:var(--accent);text-decoration:none}
.daynav .home{color:var(--muted)}
.daynav span{width:1px}
/* 分区标题 + 分类配色 */
h2{font-size:21px;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--accent);letter-spacing:-.01em}
h2.cat-official{border-color:var(--official)}
h2.cat-hot{border-color:var(--hot)}
h2.cat-papers{border-color:var(--papers)}
h2.cat-china{border-color:var(--china)}
/* 目录胶囊 */
ul.toc{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px}
ul.toc li{margin:0}
ul.toc a{display:inline-block;background:var(--card);border:1.5px solid var(--line);border-radius:999px;
 padding:6px 14px;font-size:14px;box-shadow:var(--shadow)}
ul.toc a:hover{text-decoration:none;transform:translateY(-1px)}
ul.toc li.cat-official a{border-color:var(--official);color:var(--official)}
ul.toc li.cat-hot a{border-color:var(--hot);color:var(--hot)}
ul.toc li.cat-papers a{border-color:var(--papers);color:var(--papers)}
ul.toc li.cat-china a{border-color:var(--china);color:var(--china)}
ul.list{margin:8px 0;padding-left:22px}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}
/* 条目卡片 */
ol.items{list-style:none;padding:0;margin:0;counter-reset:it}
li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;
 margin:0 0 14px;box-shadow:var(--shadow);counter-increment:it;position:relative;
 transition:transform .14s ease,box-shadow .14s ease}
li.item:hover{transform:translateY(-2px)}
li.item::before{content:counter(it);position:absolute;top:14px;right:16px;font-size:12.5px;color:#fff;
 background:var(--accent);border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;
 justify-content:center;padding:0 6px}
ol.items.cat-official li.item::before{background:var(--official)}
ol.items.cat-hot li.item::before{background:var(--hot)}
ol.items.cat-papers li.item::before{background:var(--papers)}
ol.items.cat-china li.item::before{background:var(--china)}
.item-head{font-size:16.5px;font-weight:600;line-height:1.55;padding-right:36px}
/* 「📈 后续」徽标 */
.fubadge{display:inline-block;background:var(--papers);color:#fff;font-size:11px;font-weight:600;
 border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
li.followup{border-left:3px solid var(--papers)}
blockquote{margin:10px 0 0;padding:0;border:0}
blockquote.why{background:var(--whybg);border-left:3px solid var(--whyline);border-radius:8px;
 padding:9px 12px;margin-top:12px;font-size:14px}
blockquote.note{background:var(--chip);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted);margin:14px 0}
.meta{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
code.chip{background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
p{margin:10px 0}
em{color:var(--muted)}
.footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);
 font-size:13px;text-align:center}
.toplink{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);
 border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);z-index:9}
.themebtn{position:fixed;top:16px;right:16px;z-index:10;background:var(--card);border:1px solid var(--line);
 border-radius:999px;width:42px;height:42px;font-size:18px;cursor:pointer;box-shadow:var(--shadow);
 display:flex;align-items:center;justify-content:center;padding:0}
.themebtn:hover{border-color:var(--accent)}
/* 首页搜索框 */
.search{margin:4px 0 16px}
.search input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
 padding:12px 16px;font-size:15px;color:var(--ink);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--accent)}
/* 首页日期卡 */
.day{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px 18px;margin:0 0 12px;box-shadow:var(--shadow);transition:transform .14s ease,border-color .14s}
.day:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.day .dt{font-size:17px;font-weight:600;color:var(--ink)}
.day .ct{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 9px;margin-left:8px}
.day .th{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.5}
.pcard{display:block;background:linear-gradient(135deg,var(--heroa),var(--herob));color:#fff;border:0;
 border-radius:14px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow);transition:transform .14s ease}
.pcard:hover{text-decoration:none;transform:translateY(-1px)}
.pcard .dt{font-size:17px;font-weight:700;color:#fff}
.pcard .ct{font-size:12px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.18);border-radius:999px;
 padding:2px 9px;margin-left:8px}
.pcard .th{margin-top:6px;font-size:14px;color:rgba(255,255,255,.92);line-height:1.5}
@media (max-width:560px){.hero h1{font-size:24px}.wrap{padding:16px 14px 70px}}
</style></head><body><button id="themeBtn" class="themebtn" onclick="toggleTheme()" title="切换深/浅色">🌙</button><div class="wrap" id="top"><div class="hero"><h1>🛠️ 每周动手实操</h1><div class="subtitle">每周一篇模型精讲 + 一个动手小教程 · 中文讲解 · 混合深度 · 每周二更新</div></div><div class="search"><input id="q" type="search" placeholder="🔍 搜索主题…"></div><a class="day" href="2026-07-30.html"><span class="dt">2026-07-30</span><span class="ct">第 1 期</span><div class="th">📘 Scaling Laws(缩放定律) · 🔧 用 nanoGPT 亲手训练你的第一个 GPT</div></a><p style="margin-top:18px"><a href="../index.html">⌂ 返回日报首页</a></p><div class="footer">由 Claude 每天自动采集 · 本地渲染网页版 · <a href="https://liiiiink.github.io/AiDigest/" target="_blank" rel="noopener">在线版</a></div></div><a class="toplink" href="#top">↑ 顶部</a><script>
(function(){
  var root=document.documentElement, key='ai-digest-theme', btn=document.getElementById('themeBtn');
  function sysDark(){ return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
  function isDark(){ return root.classList.contains('dark') || (!root.classList.contains('light') && sysDark()); }
  function paint(){ if(btn) btn.textContent = isDark()? '☀️':'🌙'; }
  var saved=null; try{ saved=localStorage.getItem(key); }catch(e){}
  if(saved==='dark') root.classList.add('dark'); else if(saved==='light') root.classList.add('light');
  window.toggleTheme=function(){
    if(isDark()){ root.classList.remove('dark'); root.classList.add('light'); try{localStorage.setItem(key,'light');}catch(e){} }
    else { root.classList.remove('light'); root.classList.add('dark'); try{localStorage.setItem(key,'dark');}catch(e){} }
    paint();
  };
  paint();
  var q=document.getElementById('q');
  if(q){ q.addEventListener('input',function(){
    var v=q.value.trim().toLowerCase(), days=document.querySelectorAll('.day');
    for(var i=0;i<days.length;i++){
      days[i].style.display = (!v || days[i].textContent.toLowerCase().indexOf(v)>=0)?'':'none';
    }
  }); }
})();
</script></body></html>
